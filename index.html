<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue Front-end Starter</title>
    <!-- Polices institutionnelles (Inter pour le texte, Fira Code pour les matricules).
         Tailwind ne télécharge pas les polices : on les charge ici depuis Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 font-sans text-slate-800 antialiased">
    <!-- Vue « monte » toute l'application dans cette div -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
